<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Chat compartido · Manguito Pro</title>
<link rel="icon" href="/assets/logo.webp">
<link rel="stylesheet" href="/css/mango-base.css">
<link rel="stylesheet" href="/css/manguito.css">
</head>
<body class="mg mg-shared">
  <header class="mg-shared-top">
    <a class="mg-brand" href="/manguito/" title="Manguito Pro">
      <img src="/assets/logo.webp" alt="" width="28" height="28">
      <span>Manguito <em>Pro</em></span>
    </a>
    <span class="mg-chip-auto"><i></i>Chat compartido</span>
    <a class="mg-to-store" href="/" title="Ir a la tienda"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg><span>Tienda</span></a>
  </header>

  <main class="mg-shared-main" id="sh-main">
    <div class="mg-pay-wait"><span class="mg-spin"></span> Cargando…</div>
  </main>

  <div class="mg-shared-cta" id="sh-cta" hidden><div>
    <p id="sh-cta-text"></p>
    <button class="mg-btn-solid" type="button" id="sh-cta-btn"></button>
  </div></div>

  <div class="mg-toast" id="mg-toast" role="status" hidden></div>

<script src="/js/manguito-files.js"></script>
<script src="/js/manguito-md.js"></script>
<script src="/js/manguito-share.js"></script>
</body>
</html>
