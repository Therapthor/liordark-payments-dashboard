<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Cambia tu PIN — Manguitope</title>
<link rel="icon" href="/assets/logo.webp">
<meta name="theme-color" content="#FFC93C">
<link rel="preload" href="/fonts/outfit-800.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/nunito-sans-700.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/css/mango-base.css">
<link rel="stylesheet" href="/css/mango-link.css">
</head>
<body>
<main class="phone">
  <div class="top">
    <span class="brand"><span class="brand-logo-wrap"><img src="/assets/logo.webp" alt=""></span>Manguitope</span>
    <span class="pill" id="timer" hidden></span>
  </div>

  <section class="center" id="st-loading">
    <div class="spinner"></div>
    <p class="muted">Cargando…</p>
  </section>

  <section class="center" id="st-form" hidden>
    <h1>Cambia tu PIN</h1>
    <span class="phone-tag" id="phone"></span>
    <p class="muted">Crea un PIN nuevo de 4 números. Lo usarás para entrar a liordark.com.</p>
    <form id="form" autocomplete="off">
      <label>PIN NUEVO
        <input class="pin" id="pin1" type="password" inputmode="numeric" pattern="\d{4}" maxlength="4" required autocomplete="new-password">
      </label>
      <label>REPÍTELO
        <input class="pin" id="pin2" type="password" inputmode="numeric" pattern="\d{4}" maxlength="4" required autocomplete="new-password">
      </label>
      <p class="err" id="err"></p>
      <button class="btn orange" id="save" type="submit">Guardar PIN</button>
    </form>
  </section>

  <section class="center" id="st-done" hidden>
    <div class="circle ok">✓</div>
    <h1>¡Listo!</h1>
    <p class="muted">Tu PIN se cambió. Ya puedes entrar con tu celular y tu PIN nuevo.</p>
    <a class="btn orange" href="/">Ir a la tienda</a>
  </section>

  <section class="center" id="st-off" hidden>
    <div class="circle off">!</div>
    <h1 id="off-title">Este link venció</h1>
    <p class="muted" id="off-text">Pide uno nuevo por WhatsApp.</p>
    <a class="btn dark" href="/">Ir a la tienda</a>
  </section>
</main>

<script>
(() => {
  "use strict";
  const token = (location.pathname.match(/\/cambiar-pin\/([A-Za-z0-9]+)/) || [])[1] || "";
  const $ = id => document.getElementById(id);
  let expiresAt = 0, skew = 0, tick = null;

  function show(id) {
    ["st-loading", "st-form", "st-done", "st-off"].forEach(s => { $(s).hidden = s !== id; });
    if (id !== "st-form") { clearInterval(tick); $("timer").hidden = true; }
  }

  function off(state) {
    if (state === "used") {
      $("off-title").textContent = "Este link ya se usó";
      $("off-text").textContent = "El PIN ya se cambió. Si necesitas cambiarlo otra vez, pide un link nuevo.";
    } else {
      $("off-title").textContent = "Este link venció";
      $("off-text").textContent = "Los links duran 10 minutos. Pide uno nuevo por WhatsApp.";
    }
    show("st-off");
  }

  function startTimer() {
    const t = $("timer");
    t.hidden = false;
    const draw = () => {
      const left = Math.max(0, Math.round((expiresAt - (Date.now() + skew)) / 1000));
      t.textContent = "Vence en " + Math.floor(left / 60) + ":" + String(left % 60).padStart(2, "0");
      if (left <= 0) off("expired");
    };
    draw();
    tick = setInterval(draw, 1000);
  }

  async function load() {
    try {
      const res = await fetch("/api/pin-link/" + encodeURIComponent(token));
      const data = await res.json().catch(() => ({}));
      if (!res.ok || data.state !== "active") return off(data.state);
      skew = new Date(data.serverNow).getTime() - Date.now();
      expiresAt = new Date(data.expiresAt).getTime();
      $("phone").textContent = data.phone;
      show("st-form");
      startTimer();
      $("pin1").focus();
    } catch {
      off("expired");
    }
  }

  ["pin1", "pin2"].forEach(id => $(id).addEventListener("input", e => {
    e.target.value = e.target.value.replace(/\D/g, "").slice(0, 4);
    $("err").textContent = "";
    if (id === "pin1" && e.target.value.length === 4) $("pin2").focus();
  }));

  $("form").addEventListener("submit", async e => {
    e.preventDefault();
    const p1 = $("pin1").value, p2 = $("pin2").value;
    if (!/^\d{4}$/.test(p1)) { $("err").textContent = "El PIN debe tener 4 números."; return; }
    if (p1 !== p2) { $("err").textContent = "Los PIN no coinciden."; $("pin2").value = ""; $("pin2").focus(); return; }
    $("save").disabled = true;
    $("save").textContent = "Guardando…";
    try {
      const res = await fetch("/api/pin-link/" + encodeURIComponent(token), {
        method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ pin: p1 }),
      });
      const data = await res.json().catch(() => ({}));
      if (res.ok) return show("st-done");
      if (res.status === 410 || res.status === 404) return off(data.state);
      $("err").textContent = data.message || "No se pudo guardar. Intenta de nuevo.";
    } catch {
      $("err").textContent = "Sin conexión. Intenta de nuevo.";
    }
    $("save").disabled = false;
    $("save").textContent = "Guardar PIN";
  });

  load();
})();
</script>
</body>
</html>
