name: Deploy al VPS

# Cada push a main entra por SSH al VPS y corre lo mismo que se hacía a
# mano: git pull + npm install + build + pm2 restart del panel (id 1).
# También se puede lanzar a mano desde la pestaña Actions de GitHub.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Si llegan dos pushes seguidos, no corre dos deploys encimados.
concurrency:
  group: deploy-vps-panel
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # La dirección del servidor va en el secreto VPS_HOST (no en el repo público).
      HAS_SSH_KEY: ${{ secrets.VPS_SSH_KEY != '' && secrets.VPS_HOST != '' }}
    steps:
      - name: Avisar si falta la llave o la dirección
        if: env.HAS_SSH_KEY != 'true'
        run: |
          echo "Falta el secreto VPS_SSH_KEY o VPS_HOST en Settings > Secrets and variables > Actions. No se despliega."
          exit 1

      - name: Desplegar por SSH
        if: env.HAS_SSH_KEY == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -e
            # Node/npm/pm2 vienen de NVM, que una sesión SSH no interactiva no carga sola.
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
            cd ~/liordark-payments-dashboard
            git pull
            npm install
            npm run build
            pm2 restart 1
